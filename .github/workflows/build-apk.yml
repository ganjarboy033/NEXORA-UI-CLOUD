name: Build Nexora Cloud APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Build Environment
        run: |
          java -version
          gradle --version

      - name: Install TDLib build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf php-cli perl ninja-build

      - name: Build official TDLib for Android
        shell: bash
        run: |
          set -euo pipefail
          cd third_party/tdlib/example/android
          chmod +x ./*.sh
          ./fetch-sdk.sh SDK 23.2.8568313
          ./build-openssl.sh SDK 23.2.8568313 third-party/openssl
          ./build-tdlib.sh SDK 23.2.8568313 third-party/openssl c++_static Java 26 "arm64-v8a x86_64"

      - name: Build Debug APK with Diagnostics
        id: build
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info assembleDebug 2>&1 | tee build-debug.log

      - name: Print Diagnostic Summary
        if: always()
        shell: bash
        run: |
          echo '===== BUILD LOG (LAST 180 LINES) ====='
          if [ -f build-debug.log ]; then tail -n 180 build-debug.log; else echo 'Log belum tersedia.'; fi
          echo '===== APK OUTPUTS ====='
          find app/build/outputs/apk -type f 2>/dev/null || true
          echo '===== REPORTS ====='
          find app/build/reports -type f 2>/dev/null || true

      - name: Upload Build Logs and Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-build-debug-logs
          path: |
            build-debug.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-cloud-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
